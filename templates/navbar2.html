<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid d-flex justify-content-end align-items-center">
    
    {% csrf_token %}

    <!-- Thông báo (chuông) -->
    <div class="nav-item dropdown mr-1 position-relative" style="margin-right: 15px;">
        <a class="nav-link position-relative" href="#" id="notificationBell" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <i class="far fa-bell"></i>
          <span id="notification_count" class="badge badge-danger navbar-badge"></span>
        </a>

      <div class="dropdown-menu dropdown-menu-lg" id="notificationDropdown">

      <!-- <div class="dropdown-menu dropdown-menu-lg dropdown-menu-right" id="notificationDropdown"> -->
        <span class="dropdown-item">Loading...</span>
      </div>
    </div>

    <!-- Hiển thị tên người dùng và logout/login -->
    <div class="d-flex align-items-center">
      {% if user.is_authenticated %}
        <span class="navbar-text mr-3">Hello, {{ user.username }}!</span>
        <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Login</a>
      {% endif %}
    </div>


  </div>
</nav>

 
<style type="text/css">
#notificationDropdown {
    max-height: 300px;  /* Chiều cao tối đa */
    overflow-y: auto;   /* Cho phép cuộn dọc */
    overflow-x: hidden; /* Không cho phép cuộn ngang */

}

#notification_count {
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 50%;
    position: absolute;
    top: 0px;
    right: 0px;
    background-color: red;
    color: white;
    font-weight: bold;
    transform: translate(50%, -50%); /* Đẩy nó ra khỏi góc một chút cho đẹp */
}
#notificationDropdown {
    max-height: 300px;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 250px;
    max-width: 450px;
    white-space: normal;
    left: auto !important; /* Chống Bootstrap ghi đè */
    right: 0; /* Canh lề phải của chuông */
}

.dropdown-item {
    background-color: #e7f3ff; /* xanh da trời nhẹ */
    font-weight: bold;
}
.text-muted{
    background-color: white; /* xanh da trời nhẹ */
    
}


</style>

<script>
// có gọi mark_notification_as_read nhưng k gán is_read=true được
document.addEventListener('DOMContentLoaded', function() {
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    // Fetch thông tin thông báo ngay khi trang load
    function fetchNotifications() {
        fetch("/pentest/get_notifications/", {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            }
        })
        .then(response => response.json())
        .then(data => {
            const { notifications, unread_notis_count } = data;

            // Cập nhật số lượng thông báo chưa đọc
            const notificationCountElement = document.getElementById('notification_count');
            
            // Nếu có thông báo mới
            if (unread_notis_count > 0) {
                notificationCountElement.textContent = unread_notis_count;  // Hiển thị số lượng thông báo
                notificationCountElement.style.display = 'inline-block'; // Hiển thị badge
            } else {
                notificationCountElement.style.display = 'none';  // Ẩn nếu không có thông báo mới
            }

            // Cập nhật danh sách thông báo trong dropdown
            const dropdownMenu = document.getElementById('notificationDropdown');
            dropdownMenu.innerHTML = ''; // Clear "Loading..." text

            if (notifications.length > 0) {
                notifications.forEach(notif => {
                    const notifItem = document.createElement('a');
                    // Nếu đã đọc thì làm cho mờ hơn
                    if (notif.is_read) {
                        notifItem.classList.add('text-muted');  // 👈 thêm class mờ
                    }
                    notifItem.href = notif.url ? notif.url : '#';
                    notifItem.classList.add('dropdown-item');
                    notifItem.innerHTML = `
                        <i class="fas fa-envelope mr-2"></i> <strong>${notif.title}</strong>
                        <span class="float-right text-sm">at ${notif.created_at_vn}</span>
                        <p class="dropdown-item-description"><strong>${notif.description}</strong></p>
                    `;
                   
                    // Gắn sự kiện click để đánh dấu thông báo là đã đọc
                    notifItem.addEventListener('click', function(event) {
                        event.preventDefault();
                        
                        fetch(`/pentest/mark_notification_as_read/${notif.id}/`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': csrfToken
                            },
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (notif.url) {
                                window.location.href = notif.url;  // 👈 chuyển trang sau khi đánh dấu đã đọc
                            }
                        })
                        .catch(error => {
                            console.error('Error marking notification as read:', error);
                            if (notif.url) {
                                window.location.href = notif.url; 
                            }
                        });
                    });
                    

                    dropdownMenu.appendChild(notifItem);
                });
            } else {
                dropdownMenu.innerHTML = '<span class="dropdown-item">No notifications yet</span>';
            }
        })
        .catch(error => {
            console.error('Error fetching notifications:', error);
        });
    }

    // Lắng nghe sự kiện click vào chuông
    const notificationBell = document.getElementById('notificationBell');
    const dropdownMenu = document.getElementById('notificationDropdown');

    // Toggle dropdown khi click vào chuông
    notificationBell.addEventListener('click', function(event) {
        event.preventDefault();  // Ngăn việc reload trang

        // Mỗi lần click vào chuông sẽ làm mới thông báo
        fetchNotifications();

        // Kiểm tra xem dropdown có đang mở không
        if (dropdownMenu.classList.contains('show')) {
            dropdownMenu.classList.remove('show'); // Tắt dropdown nếu đã mở
        } else {
            dropdownMenu.classList.add('show'); // Mở dropdown nếu chưa mở
        }
    });

    // Khi click ra ngoài chuông, ẩn dropdown
    document.addEventListener('click', function(event) {
        const isClickInsideBell = notificationBell.contains(event.target);
        const isClickInsideDropdown = dropdownMenu.contains(event.target);

        // Nếu click vào ngoài chuông và dropdown, ẩn dropdown
        if (!isClickInsideBell && !isClickInsideDropdown) {
            dropdownMenu.classList.remove('show');
        }
    });

    // Lấy thông báo ngay từ đầu khi trang load
    fetchNotifications();
});

</script>
